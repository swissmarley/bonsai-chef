<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bonsai Chef</title>
    <meta name="description" content="Il diario per la cura dei tuoi bonsai: rinvaso, potatura, concimazione, strumenti e promemoria." />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bonsai Chef" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      /* Launch screen shown before the app script runs (same artwork as the iOS launch screen). */
      html, body { margin: 0; background: #fff; }
      @media (prefers-color-scheme: dark) { html, body { background: #000; } }
      .boot { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
      .boot img { width: min(55vw, 240px); height: auto; }
      @media (prefers-color-scheme: dark) { .boot img { filter: invert(1) hue-rotate(180deg) brightness(1.1); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><img src="/launch.png" alt="Bonsai Chef" width="400" height="552" /></div></div>
    <noscript>Per usare Bonsai Chef attiva JavaScript nel browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

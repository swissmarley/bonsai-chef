# This file lives in the `pwa/` folder of the repository: set "Base directory" = pwa on Netlify.
[build]
  command = "npm run build"
  publish = "dist"
  # Monorepo: skip the deploy when a push does not touch the web app (e.g. iOS-only commits).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # `pg` is only used against a local Postgres during development; keep it out of the bundle.
  external_node_modules = ["pg"]

[dev]
  framework = "#custom"
  command = "vite"
  targetPort = 5173
  port = 8888
  autoLaunch = false

# The service worker must never be cached by the browser/CDN so updates roll out.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Single-page app: every route falls back to index.html (API routes are handled by functions first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
